apiVersion: apps/v1
kind: Deployment
metadata:
  name: fooddelivery-deployment
  labels:
    app: fooddelivery
    version: "2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fooddelivery
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fooddelivery
    spec:
      containers:
      - name: fooddelivery
        image: food-delivery:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: fooddelivery-config
