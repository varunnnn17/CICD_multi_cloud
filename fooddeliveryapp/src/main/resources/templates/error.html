<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Savor Food Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container container">
            <a href="/" class="logo">
                <i class="fa-solid fa-utensils"></i> Savor
            </a>
            <div class="nav-links">
                <a th:href="@{/}">Home</a>
            </div>
        </div>
    </nav>

    <!-- ERROR CONTAINER -->
    <div class="container" style="margin-top: 140px; margin-bottom: 60px; max-width: 600px; text-align: center;">
        <div style="background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
            <div style="font-size: 4rem; color: #e74c3c; margin-bottom: 20px;">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 style="font-weight: 800; margin-bottom: 15px;">Something Went Wrong</h2>
            <p style="color: #666; font-size: 1.05rem; margin-bottom: 25px;" th:text="${error != null ? error : 'An unexpected error occurred while processing your request.'}">
                An unexpected error occurred.
            </p>
            <div style="margin-top: 20px;">
                <a th:href="@{/}" class="btn btn-primary" style="padding: 12px 30px; text-decoration: none; display: inline-block;">
                    <i class="fa-solid fa-house"></i> Return to Home
                </a>
            </div>
        </div>
    </div>

</body>
</html>
